# Case Study 1 — n8n runtime (Milestone 1, step 1.2)
#
# This file DOCUMENTS the already-running n8n instance for reproducibility.
# It adopts the existing external Docker volume `N8N_DATA` (SQLite storage) so
# there is NO data loss and your other workflows stay intact.
#
# DO NOT run this while the manually-started `N8N` container is already up —
# it will clash on port 5678 and the container name. To switch to compose-managed:
#   1) docker stop N8N && docker rm N8N       # keeps the N8N_DATA volume
#   2) docker compose up -d                    # re-attaches the same volume
#
# Single-instance demo: SQLite (the n8n default, inside N8N_DATA) is sufficient.
# We deliberately do NOT add a separate Postgres backend for n8n's own state —
# unnecessary for one instance and out of scope for this portfolio build.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: N8N
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Beirut
      - TZ=Asia/Beirut
      # No secrets here by design, and no loosened sandbox.
      #
      # Removed 2026-08-07 (Case 2, M5.8): SHOPIFY_WEBHOOK_SECRET_C2 and
      # N8N_BLOCK_ENV_ACCESS_IN_NODE=false. They existed for a plan to compute
      # the Shopify webhook HMAC inside a Code node; that was superseded on
      # 2026-08-02 by the native Crypto node plus a `crypto` credential
      # (`Shopify HMAC - Case 2`), which is where the signing secret actually
      # lives. See case-study-2-abandoned-cart-mena/docs/decisions.md.
      #
      # They were not merely unused — the env var's value had drifted from the
      # real signing secret, so a test signed with it was rejected as an HMAC
      # mismatch and cost a test round in M5. A dead credential that still looks
      # authoritative is worse than no credential at all.
    volumes:
      - N8N_DATA:/home/node/.n8n

volumes:
  N8N_DATA:
    external: true
